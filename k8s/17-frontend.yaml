apiVersion: apps/v1
kind: Deployment
metadata:
  name: roboshop-frontend
  namespace: roboshop
spec:
  replicas: 1
  selector:
    matchLabels: { app: roboshop-frontend }
  template:
    metadata:
      labels: { app: roboshop-frontend }
    spec:
      containers:
        - name: frontend
          image: ${ACR_LOGIN_SERVER}/roboshop-frontend:${IMAGE_TAG}
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: roboshop-frontend
  namespace: roboshop
spec:
  selector: { app: roboshop-frontend }
  ports: [{ port: 80, targetPort: 80 }]
