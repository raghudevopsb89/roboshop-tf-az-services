apiVersion: v1
kind: Namespace
metadata:
  name: roboshop
---
# Non-secret wiring. Service names must match the upstreams the frontend's
# nginx.conf proxies to (roboshop-<svc>), otherwise the UI 502s.
apiVersion: v1
kind: ConfigMap
metadata:
  name: roboshop-config
  namespace: roboshop
data:
  CATALOGUE_URL: "http://roboshop-catalogue:8002"
  CART_URL: "http://roboshop-cart:8003"
  USER_URL: "http://roboshop-user:8001"
  SHIPPING_URL: "http://roboshop-shipping:8004"
  SERVICEBUS_QUEUE: "orders"
  # Azure MySQL Flexible Server rejects plaintext connections.
  MYSQL_TLS: "true"
  MYSQL_SSL: "true"
  DB_SSL_MODE: "REQUIRED"
  # Azure Managed Redis is on a public endpoint, so the cart talks rediss://.
  REDIS_TLS: "true"
