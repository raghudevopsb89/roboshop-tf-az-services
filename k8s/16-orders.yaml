apiVersion: apps/v1
kind: Deployment
metadata:
  name: roboshop-orders
  namespace: roboshop
spec:
  replicas: 1
  selector:
    matchLabels: { app: roboshop-orders }
  template:
    metadata:
      labels: { app: roboshop-orders }
    spec:
      containers:
        - name: orders
          image: ${ACR_LOGIN_SERVER}/roboshop-orders:${IMAGE_TAG}
          ports: [{ containerPort: 8007 }]
          envFrom:
            - configMapRef: { name: roboshop-config }
          env:
            - name: MONGO_URL
              valueFrom: { secretKeyRef: { name: roboshop-secrets, key: MONGO_URL_ORDERS } }
            - name: SERVICEBUS_CONNECTION_STRING
              valueFrom: { secretKeyRef: { name: roboshop-secrets, key: SERVICEBUS_CONNECTION_STRING } }
          startupProbe:
            httpGet: { path: /health, port: 8007 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /health, port: 8007 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8007 }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: roboshop-orders
  namespace: roboshop
spec:
  selector: { app: roboshop-orders }
  ports: [{ port: 8007, targetPort: 8007 }]
