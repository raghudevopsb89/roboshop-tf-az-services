user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr $time_local $request $status $http_referer "$http_user_agent" $http_x_forwarded_for $request_time $upstream_response_time';
    access_log  /var/log/nginx/access.log  main;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Do not override Host on these proxy_pass blocks. nginx defaults it to
        # $proxy_host (the upstream name:port), which is what Istio matches on to
        # route outbound traffic. Forcing the public Host sends the request to the
        # PassthroughCluster instead: plaintext, no SPIFFE identity, and the
        # backend AuthorizationPolicy rejects it with "RBAC: access denied".
        location /api/catalogue/ {
            rewrite ^/api/catalogue/(.*)$ /$1 break;
            proxy_pass http://roboshop-catalogue:8002;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/user/ {
            rewrite ^/api/user/(.*)$ /$1 break;
            proxy_pass http://roboshop-user:8001;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/cart/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://roboshop-cart:8003;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/shipping/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://roboshop-shipping:8004;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/payment/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://roboshop-payment:8005;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ratings {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://roboshop-ratings:8006;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/orders/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://roboshop-orders:8007;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /stub_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }

        location / {
            try_files $uri $uri/index.html $uri.html /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}

